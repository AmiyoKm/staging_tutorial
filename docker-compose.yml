services:
  postgres:
    image: postgres:18.0-alpine3.22
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:18.0-alpine3.22
    environment:
      POSTGRES_DB: todo_test_db
      POSTGRES_USER: todo_test_user
      POSTGRES_PASSWORD: todo_test_pass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_test_user -d todo_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
