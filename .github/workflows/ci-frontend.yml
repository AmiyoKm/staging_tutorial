name: CI Frontend

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [develop, master, release/**, hotfix/**]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd frontend
          bun install

      - name: Type check
        run: |
          cd frontend
          bun run build --mode development

      - name: Run tests
        run: |
          cd frontend
          bun run test -- --run

      - name: Build Docker image
        run: |
          docker build -t todo-frontend:test ./frontend
