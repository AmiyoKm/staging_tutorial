name: Deploy Frontend to Production

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd frontend
          bun install

      - name: Create version tag
        id: tag
        run: |
          TAG=v$(date +%Y.%m.%d-%H%M%S)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git tag $TAG
          git push origin $TAG

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        run: |
          docker build \
            --build-arg VITE_API_URL=https://todo-backend-production.onrender.com \
            -t amiyokm/todo-frontend:production \
            -t amiyokm/todo-frontend:latest \
            ./frontend
          docker push amiyokm/todo-frontend:production
          docker push amiyokm/todo-frontend:latest

      - name: Health check
        run: |
          echo "Run health checks against production"
          # TODO: Add actual health checks against production URL
          # curl -f https://todo-frontend-production.onrender.com/ || exit 1
